name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Extract Any ZIP File
        run: |
          shopt -s nullglob
          for zipfile in *.zip; do
            echo "Unzipping $zipfile..."
            unzip -o "$zipfile"
          done

      - name: Build Web
        run: |
          # Znalezienie katalogu zawierającego package.json
          TARGET_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \;)
          echo "Found project directory: $TARGET_DIR"
          cd "$TARGET_DIR"
          
          npm install
          if [ ! -d "android" ]; then npx cap add android; fi
          npm run cap:build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          TARGET_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \;)
          cd "$TARGET_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: /**/outputs/apk/debug/app-debug.apk
