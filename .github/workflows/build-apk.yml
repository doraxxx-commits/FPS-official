name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Extract ZIP
        run: |
          if [ -f "FPS naprawione.zip" ]; then unzip -o "FPS naprawione.zip"; fi
          if [ -f "FPS-fixed.zip" ]; then unzip -o "FPS-fixed.zip"; fi
          if [ -f "FPS.zip" ]; then unzip -o "FPS.zip"; fi

      - name: Build Web
        run: |
          cd FPS
          npm install
          if [ ! -d "android" ]; then npx cap add android; fi
          npm run cap:build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd FPS/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: FPS/android/app/build/outputs/apk/debug/app-debug.apk
